# LOCAL MAC ONLY — standalone configuration, NOT a production override.
# Use explicitly: docker compose -f docker-compose.local.yml up -d --build
# Duplication is intentional: no external production network or merge-tag dependency.
name: bimspect_website_local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LAUNCH_AT: ${NEXT_PUBLIC_LAUNCH_AT:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: bimspect-website:local
    init: true
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_LAUNCH_AT: ${NEXT_PUBLIC_LAUNCH_AT:-}
      BIMSPECT_CRM_URL: ${BIMSPECT_CRM_URL:-}
      BIMSPECT_CRM_API_SECRET: ${BIMSPECT_CRM_API_SECRET:-}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      REVOLUT_MERCHANT_SECRET_KEY: ${REVOLUT_MERCHANT_SECRET_KEY:-}
      REVOLUT_WEBHOOK_SECRET: ${REVOLUT_WEBHOOK_SECRET:-}
      REVOLUT_MERCHANT_API_VERSION: ${REVOLUT_MERCHANT_API_VERSION:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0755
    networks:
      bimspect_local:
        aliases:
          - marketing-web
    logging: *default-logging

  nginx-test:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    networks:
      - bimspect_local
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging: *default-logging

networks:
  bimspect_local:
    driver: bridge
